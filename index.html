<body>

  <!-- ══════════════════════════════════════════════════
       Shared decorative icons (hearts, sprigs). Nothing to edit.
  ══════════════════════════════════════════════════ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <path id="ico-heart"
        d="M12 20.8 C 6 16.2 2.8 12.7 2.8 9.1 C 2.8 6.5 4.8 4.5 7.3 4.5 C 9.2 4.5 10.9 5.6 12 7.4 C 13.1 5.6 14.8 4.5 16.7 4.5 C 19.2 4.5 21.2 6.5 21.2 9.1 C 21.2 12.7 18 16.2 12 20.8 Z" />
      <g id="sprigCorner">
        <path d="M14 78 C 20 58 20 34 10 8" fill="none" stroke="#B9A2C4" stroke-width="1.6" stroke-linecap="round" />
        <path d="M17 62 C 26 60 32 53 33 45 C 25 47 19 53 17 62 Z" fill="#CDBBD8" />
        <path d="M18 50 C 9 48 3 41 2 33 C 10 35 16 41 18 50 Z" fill="#CDBBD8" />
        <path d="M16 38 C 24 36 29 30 30 23 C 23 25 18 30 16 38 Z" fill="#D6C7DF" />
        <path d="M13 26 C 6 24 2 18 1 12 C 7 13 11 18 13 26 Z" fill="#D6C7DF" />

        <circle cx="5.5" cy="12" r="1.6" fill="#B9A2C4" />

      <g id="minisprig">
        <path d="M12 42 C 13 30 13 16 12 4" fill="none" stroke="#A98CB5" stroke-width="1.4" stroke-linecap="round" />

  </svg>


  <!-- ══════════════════════════════════════════════════
       1 · PASSWORD GATE
  ══════════════════════════════════════════════════ -->
  <section class="gate" id="gate" aria-label="A little gift — answer to open">
    <svg class="gate-sprig gs-tl" viewBox="0 0 80 82" aria-hidden="true">
      <use href="#sprigCorner" />
    </svg>
    <svg class="gate-sprig gs-br" viewBox="0 0 80 82" aria-hidden="true">
      <use href="#sprigCorner" />
    </svg>

    <div class="gate-inner">
      <svg class="gate-heart" viewBox="0 0 24 24" aria-hidden="true">
        <use href="#ico-heart" />
      </svg>

      <p class="gate-kicker">For my babi</p>
      <p class="gate-title">A little something<br>for you.</p>

      <div class="gate-rule" aria-hidden="true"></div>

      <form id="gate-form" class="gate-form" novalidate>
        <label class="gate-q" for="answer">What's my favorite flavor?</label>
        <div class="gate-field">
          <input id="answer" name="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
            placeholder="your answer…" autofocus>
        </div>
        <button class="gate-btn" type="submit">enter ♡</button>
        <p class="gate-msg" id="gate-msg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>


  <!-- ══════════════════════════════════════════════════
       THE GIFT
  ══════════════════════════════════════════════════ -->
  <main class="main" id="main" aria-hidden="true" tabindex="-1">

    <!-- ── 2 · THE BOUQUET ──────────────────────────────
         12 roses (6 pink, 6 white) in a mixed, natural scatter.
         Move any flower by editing its transform="translate(x y)".
         Pink roses use fills gP1–gP3, white roses gW1–gW3. -->
    <section class="stage" aria-label="A bouquet of flowers">
      <div class="bouquet-frame">
        <svg id="bouquet" viewBox="0 0 420 520" role="img"
          aria-label="A hand-drawn bouquet of white and pink roses with lavender tulips, tied with a soft bow">
          <defs>
            <!-- one ruffled rose petal, reused by every ring of every rose -->
            <path id="petalShape" d="M 0 5
              C -9 4 -17 -1 -18.5 -9
              C -19.5 -15 -17 -21 -12.5 -23.5
              C -14.5 -27 -11 -30.5 -7.5 -28.5
              C -6 -32 -0.5 -32.5 1.5 -29
              C 4.5 -31.5 9 -30 9.5 -26.5
              C 14 -25 17.5 -20 17.5 -14
              C 17 -5 9 3.5 0 5 Z" />

            <!-- pink rose petal shades: outer light → inner deep -->
            <linearGradient id="gP1" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#EFAFC4" />
              <stop offset="100%" stop-color="#FBDCE5" />
            </linearGradient>
            <linearGradient id="gP2" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#E59CB5" />
              <stop offset="100%" stop-color="#F6C6D5" />
            </linearGradient>
            <linearGradient id="gP3" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#D487A2" />
              <stop offset="100%" stop-color="#EBAAC0" />
            </linearGradient>
            <!-- white rose petal shades -->
            <linearGradient id="gW1" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#EBDCE7" />
              <stop offset="100%" stop-color="#FFFFFF" />
            </linearGradient>
            <linearGradient id="gW2" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#E2CCDD" />
              <stop offset="100%" stop-color="#FDF8F6" />
            </linearGradient>
            <linearGradient id="gW3" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#D6BACD" />
              <stop offset="100%" stop-color="#F7EDEE" />
            </linearGradient>
            <!-- tulips -->
            <linearGradient id="gTL" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#D2BCDD" />
              <stop offset="100%" stop-color="#8F7098" />
            </linearGradient>
            <linearGradient id="gTLd" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#B89FC6" />
              <stop offset="100%" stop-color="#7C6288" />
            </linearGradient>
            <linearGradient id="gTP" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#F4CBD9" />
              <stop offset="100%" stop-color="#D18EA7" />
            </linearGradient>
            <linearGradient id="gTPd" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#E5B0C4" />
              <stop offset="100%" stop-color="#BD7D96" />
            </linearGradient>
            <linearGradient id="gLeaf" x1="0" y1="1" x2="0.55" y2="0">

              <stop offset="100%" stop-color="#6F7F66" />

            <!-- lavender tulip head -->

            </g>

            <!-- leaves behind the dome (leaves bloom next) -->
            <g class="leaf" transform="translate(84 212) rotate(-64) scale(1.15)" style="--d:1.05s">
              <g class="leaf-in">
                <use href="#leafG" />
              </g>
            </g>
            <g class="leaf" transform="translate(338 208) scale(-1.15 1.15) rotate(-62)" style="--d:1.15s">

            <!-- white, top center (y=116) -->

              <g class="rose-in">
                <g class="ring ring-1" fill="url(#gW1)" stroke="rgba(169,140,181,.30)" stroke-width=".7">

    <!-- ── 4 · THE LETTER · a real folded paper, unfolds on touch ──

    <section class="letter-sec">
      <div class="letter-wrap reveal">
        <div class="sheet" aria-hidden="true"></div>

        <figure class="letter" id="letter">

          <!-- master copy: starts empty; filled by JS after decryption -->
          <div class="letter-master paper" id="letterMaster"></div>

          <!-- the 3D fold, built by JS -->
          <div class="fold3d" id="fold3d" aria-hidden="true"></div>

          <!-- closed cover: the sealed face she taps -->
          <button class="fold-cover paper" id="foldCover" type="button" aria-expanded="false" aria-controls="srLetter">
            <span class="cover-title">a letter, for you</span>
            <span class="cover-seal" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15">
                <use href="#ico-heart" />
              </svg>
            </span>
            <span class="cover-hint">tap to open ♡</span>
          </button>
        </figure>

        <!-- screen-reader copy of the letter -->
        <div class="sr-only" id="srLetter" tabindex="-1" aria-label="Your letter"></div>
      </div>
    </section>

      <div class="mp-inner">
        <!-- Spinning Record / Disc -->
        <div class="mp-disc-wrap">
          <div class="mp-disc" id="mpDisc" aria-hidden="true">
            <svg class="mp-disc-heart" viewBox="0 0 24 24">
              <use href="#ico-heart" />
            </svg>
          </div>
        </div>

        <!-- Song Metadata -->
        <div class="mp-info">
          <div class="mp-title-wrap">
            <span class="mp-title" id="mpTitle">Select a track</span>
          </div>
          <div class="mp-sub">
            <span class="mp-artist" id="mpArtist">The Ridleys</span>
            <span class="mp-sep">·</span>
            <span class="mp-time-text"><span id="mpCurrentTime">0:00</span> / <span id="mpDuration">0:00</span></span>
          </div>
        </div>

        <!-- Action Controls -->
        <div class="mp-controls">
          <button type="button" class="mp-btn mp-btn-prev" id="mpPrevBtn" aria-label="Previous song" title="Previous song">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
              <path d="M6 6h2.5v12H6zm3.5 6l9 6V6z"/>
            </svg>
          </button>

          <button type="button" class="mp-btn mp-btn-play" id="mpPlayBtn" aria-label="Play song" title="Play">
            <svg class="mp-icon-play" viewBox="0 0 24 24" width="17" height="17" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg class="mp-icon-pause" viewBox="0 0 24 24" width="17" height="17" fill="currentColor">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <button type="button" class="mp-btn mp-btn-next" id="mpNextBtn" aria-label="Next song" title="Next song">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
              <path d="M6 18l9-6-9-6v12zM15.5 6H18v12h-2.5z"/>
            </svg>
          </button>

          <button type="button" class="mp-btn mp-btn-list" id="mpListBtn" aria-label="Toggle playlist" title="All These and More">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
            </svg>
            <span class="mp-count" id="mpCount">10</span>
          </button>
        </div>
      </div>
    </div>
  </aside>
